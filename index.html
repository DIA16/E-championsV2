<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>E-Champions Result Manager v9.3</title>
<style>
:root{
  --bg:#fff;--bg2:#f5f5f3;--bg3:#ededea;
  --text:#1a1a18;--text2:#5f5e5a;--text3:#888780;
  --border:rgba(0,0,0,.12);--border2:rgba(0,0,0,.22);
  --info-bg:#e6f1fb;--info-text:#185fa5;--info-border:rgba(24,95,165,.3);
  --success-bg:#eaf3de;--success-text:#3b6d11;
  --danger-bg:#fcebeb;--danger-text:#a32d2d;
  --warn-bg:#faeeda;--warn-text:#854f0b;
  --teal:#0f6e56;--teal-bg:#e1f5ee;
  --gold:#b8860b;--gold-bg:#fdf6dc;
  --radius:8px;--radius-lg:12px;
  --font-scale:1;
}
.dark{
  --bg:#1a1a18;--bg2:#2c2c2a;--bg3:#444441;
  --text:#f1efe8;--text2:#b4b2a9;--text3:#888780;
  --border:rgba(255,255,255,.12);--border2:rgba(255,255,255,.22);
  --info-bg:#0c447c;--info-text:#b5d4f4;--info-border:rgba(181,212,244,.3);
  --success-bg:#27500a;--success-text:#c0dd97;
  --danger-bg:#791f1f;--danger-text:#f7c1c1;
  --warn-bg:#633806;--warn-text:#fac775;
  --teal:#5dcaa5;--teal-bg:#085041;
  --gold:#f0c040;--gold-bg:#3a2e00;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg2);color:var(--text);font-size:calc(15px*var(--font-scale));min-height:100vh;transition:background .2s,color .2s}

/* ── Header ── */
.hdr{background:var(--bg);border-bottom:.5px solid var(--border);padding:.7rem 1rem .55rem;position:sticky;top:0;z-index:20}
.hdr-top{display:flex;align-items:center;gap:10px}
.hdr-logo{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1.5px solid var(--border)}
.hdr-text{flex:1;min-width:0}
.hdr-text h1{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-text .school-name{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-controls{display:flex;gap:6px;flex-shrink:0}
.icon-btn{background:var(--bg2);border:.5px solid var(--border);border-radius:var(--radius);padding:5px 8px;font-size:13px;cursor:pointer;color:var(--text2);transition:background .15s}
.icon-btn:active{transform:scale(.95)}
#hdr-saved{font-size:10px;color:var(--teal);margin-top:3px;min-height:13px;padding-left:48px}
.prog{display:flex;gap:3px;margin-top:7px}
.prog-seg{flex:1;height:3px;border-radius:2px;background:var(--border);transition:background .3s}
.prog-seg.done{background:var(--teal)}
.prog-seg.active{background:var(--info-text)}

/* ── Layout ── */
.wrap{padding:.85rem .85rem 5rem;max-width:600px;margin:0 auto}
.pg-title{font-size:15px;font-weight:600;color:var(--text);margin:1rem 0 .2rem}
.pg-sub{font-size:12px;color:var(--text3);margin-bottom:.9rem}
label{font-size:13px;color:var(--text2);display:block;margin-bottom:4px}
select,input[type=text],input[type=number],textarea{
  width:100%;padding:10px 12px;border:.5px solid var(--border2);border-radius:var(--radius);
  background:var(--bg);color:var(--text);font-size:calc(15px*var(--font-scale));margin-bottom:11px;
  -webkit-appearance:none;appearance:none;font-family:inherit;
}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--info-text);box-shadow:0 0 0 3px var(--info-bg)}
textarea{resize:vertical;min-height:80px;line-height:1.5}

/* ── Buttons ── */
.btn{width:100%;padding:12px;border:.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;margin-top:4px;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--info-bg);color:var(--info-text);border-color:var(--info-border)}
.btn-success{background:var(--success-bg);color:var(--success-text);border-color:rgba(59,109,17,.3)}
.btn-teal{background:var(--teal-bg);color:var(--teal);border-color:rgba(15,110,86,.3)}
.btn-print{background:#f3eeff;color:#5b21b6;border-color:rgba(91,33,182,.3)}
.btn-warn{background:var(--warn-bg);color:var(--warn-text);border-color:rgba(133,79,11,.3)}

/* ── Cards & Alerts ── */
.card{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1rem .85rem;margin-bottom:14px}
.alert{padding:9px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:10px;line-height:1.5}
.alert-info{background:var(--info-bg);color:var(--info-text)}
.alert-success{background:var(--success-bg);color:var(--success-text)}
.alert-danger{background:var(--danger-bg);color:var(--danger-text)}
.alert-warn{background:var(--warn-bg);color:var(--warn-text)}
.spacer{height:8px}
.or-divider{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--text3);font-size:12px}
.or-divider::before,.or-divider::after{content:'';flex:1;height:.5px;background:var(--border)}
.btn-upload{background:var(--bg);color:var(--text2);border:.5px dashed var(--border2);border-radius:var(--radius);padding:12px;width:100%;font-size:14px;font-weight:500;cursor:pointer;display:block;text-align:center;margin-top:4px;transition:background .15s}
.btn-upload:active{transform:scale(.98);background:var(--bg2)}
.upload-hint{font-size:11px;color:var(--text3);text-align:center;margin-top:6px}

/* ── Pupil card ── */
.pupil-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pupil-num{width:26px;height:26px;border-radius:50%;background:var(--info-bg);color:var(--info-text);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pupil-name-inp{flex:1;margin-bottom:0!important;font-weight:500}
.pupil-num.absent-num{background:var(--danger-bg);color:var(--danger-text)}
.toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;background:var(--bg2);border-radius:var(--radius);padding:8px 10px}
.toggle-row label{margin-bottom:0;font-size:13px;color:var(--text2);cursor:pointer;flex:1}
.toggle{width:38px;height:22px;appearance:none;-webkit-appearance:none;background:var(--border2);border-radius:11px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.toggle:checked{background:var(--teal)}
.toggle::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle:checked::after{left:18px}
.absent-banner{background:var(--danger-bg);color:var(--danger-text);border-radius:var(--radius);padding:7px 10px;font-size:12px;margin-bottom:8px;text-align:center;font-weight:500}

/* ── Score grid ── */
.score-hdr{display:grid;grid-template-columns:1fr 54px 54px 62px 60px;gap:4px;margin-bottom:6px;padding:6px 8px;background:var(--bg3);border-radius:6px}
.score-hdr span{font-size:10px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:center}
.score-hdr span:first-child{text-align:left}
.score-row{display:grid;grid-template-columns:1fr 54px 54px 62px 60px;gap:4px;align-items:center;padding:7px 8px;border-radius:7px;margin-bottom:2px;transition:background .1s}
.score-row:nth-child(odd){background:var(--bg2)}
.score-row:nth-child(even){background:var(--bg)}
.score-row:focus-within{background:var(--info-bg)!important;outline:.5px solid var(--info-border)}
.subj-lbl{font-size:11.5px;font-weight:500;color:var(--text);line-height:1.35;padding-right:4px;letter-spacing:.01em}
.score-inp{margin-bottom:0!important;padding:8px 3px!important;font-size:13px!important;text-align:center;border-radius:6px!important;background:var(--bg)!important}
.score-inp:focus{border-color:var(--info-text)!important;box-shadow:0 0 0 2px var(--info-bg)!important;z-index:1;position:relative;background:var(--bg)!important}
.tot-cell{font-size:12px;font-weight:700;text-align:center;padding:8px 3px;border-radius:6px;background:var(--bg3);color:var(--text3);transition:background .15s,color .15s}
.tot-ok{color:var(--success-text)!important;background:var(--success-bg)!important}
.tot-err{color:var(--danger-text)!important;background:var(--danger-bg)!important}
.score-section-gap{height:10px}

/* ── Progress bar (step 2) ── */
.fill-bar-wrap{background:var(--bg2);border-radius:var(--radius);padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.fill-bar-track{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.fill-bar-inner{height:100%;background:var(--teal);border-radius:3px;transition:width .3s}
.fill-bar-label{font-size:11px;color:var(--text3);white-space:nowrap}

/* ── Pupil summary bar ── */
.pupil-summary{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:.5px solid var(--border)}
.sum-chip{flex:1;background:var(--bg2);border-radius:var(--radius);padding:6px 4px;text-align:center}
.sum-chip .lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:2px}
.sum-chip .val{font-size:15px;font-weight:600;color:var(--text)}
.sum-chip.grand .val{color:var(--info-text)}
.sum-chip.avg .val{color:var(--teal)}

/* ── Results ── */
table.rt{width:100%;border-collapse:collapse;font-size:13px}
table.rt th{text-align:left;padding:5px 7px;font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.03em;border-bottom:.5px solid var(--border)}
table.rt td{padding:7px 7px;color:var(--text);border-bottom:.5px solid var(--border)}
table.rt tr:last-child td{border-bottom:none}
table.rt td:last-child,table.rt th:last-child{text-align:right}
.sum-row td{font-weight:600;background:var(--bg2)}
.sum-row.grand td{color:var(--info-text)}
.sum-row.avg td{color:var(--teal)}
.res-name{font-size:14px;font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;background:var(--info-bg);color:var(--info-text)}
.rank-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700;background:var(--gold-bg);color:var(--gold)}
.grade-A{color:#1a7a1a;font-weight:700}
.grade-B{color:var(--teal);font-weight:600}
.grade-C{color:var(--info-text);font-weight:600}
.grade-D{color:#b06000;font-weight:600}
.grade-E{color:var(--warn-text);font-weight:600}
.grade-F{color:var(--danger-text);font-weight:700}

/* ── Class summary card ── */
.cls-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.cls-sum-box{background:var(--bg);border:.5px solid var(--border);border-radius:var(--radius);padding:10px 6px;text-align:center}
.cls-sum-box .csl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px}
.cls-sum-box .csv{font-size:16px;font-weight:700;color:var(--text)}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--bg);border-radius:var(--radius-lg);padding:1.4rem;max-width:360px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.modal-box h2{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--text)}
.modal-box p{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:10px}
.modal-box ul{font-size:13px;color:var(--text2);padding-left:18px;line-height:1.8;margin-bottom:14px}

/* ── Footer ── */
.app-footer{text-align:center;font-size:10px;color:var(--text3);padding:10px 0 30px;margin-top:4px}

/* ── Print ── */
#print-area{display:none}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  .print-page{page-break-after:always;width:100%;padding:12mm 14mm 10mm;font-family:Arial,sans-serif;font-size:9.5pt;color:#000;box-sizing:border-box}
  .print-page:last-child{page-break-after:auto}
  .print-hdr{display:flex;align-items:center;gap:10pt;margin-bottom:8pt;border-bottom:1.5pt solid #000;padding-bottom:6pt}
  .print-logo{width:44pt;height:44pt;border-radius:50%;object-fit:cover}
  .print-school-info{flex:1}
  .print-school{font-size:12pt;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .print-location{font-size:8.5pt;color:#555;margin-top:1pt}
  .print-motto{font-size:8pt;color:#777;font-style:italic;margin-top:1pt}
  .print-subtitle{text-align:center;font-size:9pt;color:#444;margin-bottom:8pt;letter-spacing:.02em}
  .print-meta{display:flex;justify-content:space-between;border-top:1pt solid #ccc;border-bottom:1pt solid #ccc;padding:4pt 0;margin-bottom:8pt;font-size:9pt}
  .print-meta span{font-weight:600}
  .print-pupil-name{font-size:11pt;font-weight:700;text-transform:uppercase;margin-bottom:6pt}
  .print-rank{font-size:9pt;color:#555;margin-bottom:6pt}
  table.print-tbl{width:100%;border-collapse:collapse;font-size:8.5pt;margin-bottom:6pt}
  table.print-tbl th{background:#1a1a18;color:#fff;padding:4pt 5pt;text-align:left;font-weight:600;font-size:8pt}
  table.print-tbl th:not(:first-child){text-align:center}
  table.print-tbl td{padding:3.5pt 5pt;border-bottom:.5pt solid #ccc;vertical-align:middle}
  table.print-tbl td:not(:first-child){text-align:center;font-weight:500}
  table.print-tbl tr:nth-child(even) td{background:#f8f8f8}
  .print-summary{display:flex;gap:8pt;margin-top:4pt}
  .print-sum-box{flex:1;border:1pt solid #000;border-radius:3pt;padding:5pt 6pt;text-align:center}
  .print-sum-box .ps-lbl{font-size:7pt;text-transform:uppercase;letter-spacing:.05em;color:#555;margin-bottom:1pt}
  .print-sum-box .ps-val{font-size:12pt;font-weight:700;color:#000}
  .print-footer{margin-top:8pt;border-top:.5pt solid #ccc;padding-top:4pt;font-size:7pt;color:#888;display:flex;justify-content:space-between}
  /* Class sheet */
  .classsheet-page{page-break-after:always;padding:10mm 12mm 8mm;font-family:Arial,sans-serif;font-size:8.5pt;color:#000;box-sizing:border-box}
  .classsheet-page:last-child{page-break-after:auto}
  table.cs-tbl{width:100%;border-collapse:collapse;font-size:7.5pt}
  table.cs-tbl th{background:#1a1a18;color:#fff;padding:3.5pt 4pt;font-weight:600;font-size:7pt;text-align:center}
  table.cs-tbl th:first-child{text-align:left}
  table.cs-tbl td{padding:3pt 4pt;border-bottom:.4pt solid #ccc;text-align:center}
  table.cs-tbl td:nth-child(2){text-align:left}
  table.cs-tbl tr:nth-child(even) td{background:#f5f5f5}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <img class="hdr-logo" id="hdr-logo" src="" alt="School logo">
    <div class="hdr-text">
      <h1>E-Champions Result Manager</h1>
      <div class="school-name">E-Champions Nursery &amp; Primary School, Omu-Aran</div>
    </div>
    <div class="hdr-controls">
      <button class="icon-btn" onclick="toggleDark()" title="Dark mode" id="dark-btn">🌙</button>
      <button class="icon-btn" onclick="cycleFontSize()" title="Font size" id="font-btn">Aᴬ</button>
    </div>
  </div>
  <div id="hdr-saved"></div>
  <div class="prog">
    <div class="prog-seg active" id="d1"></div>
    <div class="prog-seg" id="d2"></div>
    <div class="prog-seg" id="d3"></div>
  </div>
</div>

<div class="wrap" id="app"></div>
<div id="print-area"></div>
<div class="app-footer">Built by EDA-NI-MI &nbsp;·&nbsp; Version 9.3 &nbsp;·&nbsp; June 2026</div>

<script>
/* ══════════════════════════════════════════
   SCHOOL DATA
══════════════════════════════════════════ */
const CLASSES=['Basic 1','Basic 2','Basic 3A','Basic 3B','Basic 4A','Basic 4B','Basic 5','Nursery Two','Nursery One','KG 2A','KG 2B','KG 1','Creche'];
const GRP={'Basic 1':1,'Basic 2':1,'Basic 3A':1,'Basic 3B':1,'Basic 4A':1,'Basic 4B':1,'Basic 5':1,'Nursery Two':2,'Nursery One':3,'KG 2A':4,'KG 2B':4,'KG 1':5,'Creche':5};
const SUBJS={
  1:['ENGLISH','BASIC SCIENCE','CREATIVE ARTS','SOCIAL STUDIES','MATHEMATICS','CIVIC EDUCATION','YORUBA','PHYSICAL & HEALTH EDUCATION','VERBAL REASONING','AGRICULTURAL SCIENCE','COMPUTER STUDIES','CHRISTIAN RELIGIOUS STUDIES','QUANTITATIVE REASONING','FINE ARTS','HANDWRITING','SPELLING','PHONICS','FRENCH'],
  2:['LITERACY','BASIC SCIENCE','CREATIVE ARTS','SOCIAL STUDIES','NUMERACY','CIVIC EDUCATION','RHYMES','PHYSICAL & HEALTH EDUCATION','VERBAL REASONING','AGRICULTURAL SCIENCE','COMPUTER STUDIES','BIBLE KNOWLEDGE','QUANTITATIVE REASONING','FINE ARTS','HANDWRITING','SPELLING','PHONICS','FRENCH'],
  3:['LITERACY','BASIC SCIENCE','CREATIVE ARTS','SOCIAL STUDIES','NUMERACY','CIVIC EDUCATION','RHYMES','PHYSICAL & HEALTH EDUCATION','VERBAL REASONING','COMPUTER STUDIES','BIBLE KNOWLEDGE','QUANTITATIVE REASONING','HANDWRITING'],
  4:['NUMERACY','LITERACY','QUANTITATIVE REASONING','VERBAL REASONING','SOCIAL HABITS','HEALTH HABITS','POEM','BASIC SCIENCE','CREATIVE ARTS'],
  5:['NUMERACY','LITERACY','SOCIAL HABITS','HEALTH HABITS','POEM','BASIC SCIENCE','CREATIVE ARTS']
};
const RELIG={1:'CHRISTIAN RELIGIOUS STUDIES',2:'BIBLE KNOWLEDGE',3:'BIBLE KNOWLEDGE'};

function getGrade(avg){
  if(avg>=70)return{g:'A',r:'Excellent'};
  if(avg>=60)return{g:'B',r:'Good'};
  if(avg>=50)return{g:'C',r:'Average'};
  if(avg>=45)return{g:'D',r:'Pass'};
  if(avg>=40)return{g:'E',r:'Poor'};
  return{g:'F',r:'Fail'};
}

function ordinal(n){
  const s=['th','st','nd','rd'],v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}

/* ══════════════════════════════════════════

let S={step:1,cls:'Basic 5',n:0,session:'2025/2026',pupils:[],results:[]};
let darkMode=false;
let fontScale=1;

/* ══════════════════════════════════════════
   localStorage — per class + session

const STORE_PFX='echampions_v3_';
const OLD_PFXS=['echampions_v2_','echampions_state_v1'];

/* Migrate any old-prefix data to v3 on startup */
function migrateOldData(){
  try{
    const toMigrate=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k) continue;
      for(const old of OLD_PFXS){
        if(k.startsWith(old)&&!k.endsWith('_data')){
          const d=localStorage.getItem(k+'_data')||localStorage.getItem(k);
          if(d) try{
            const p=JSON.parse(d);
            if(p&&p.cls&&p.session){
              toMigrate.push({old:k,data:p});
            }
          }catch(e){}
        }
      }
    }
    toMigrate.forEach(({old,data})=>{
      const newKey=storeKey(data.cls,data.session);
      localStorage.setItem(newKey,'1');
      localStorage.setItem(newKey+'_data',JSON.stringify(data));
      localStorage.removeItem(old);
      localStorage.removeItem(old+'_data');
    });
    if(toMigrate.length) console.log(`Migrated ${toMigrate.length} saved class(es) to v3`);
  }catch(e){}
}
const PREFS_KEY='echampions_prefs';
const FIRST_USE_KEY='echampions_firstuse';

function storeKey(cls,sess){
  return STORE_PFX+(cls||S.cls).replace(/\s/g,'_')+'_'+(sess||S.session).replace(/\//g,'-');
}
function saveState(){
  try{
    S.savedAt=Date.now();
    localStorage.setItem(storeKey(),'1');
    localStorage.setItem(storeKey()+'_data',JSON.stringify(S));
    updateSavedLabel();
  }catch(e){}
}
function clearState(cls,sess){
  try{const k=storeKey(cls,sess);localStorage.removeItem(k);localStorage.removeItem(k+'_data');}catch(e){}
}
function getAllSaved(){
  const out=[];
  try{
    // Snapshot keys first — iterating localStorage by index is unstable
    const keys=[];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k)keys.push(k);}
    keys.forEach(k=>{
      const isNew=k.startsWith(STORE_PFX)&&!k.endsWith('_data');
      if(!isNew)return;
      const d=localStorage.getItem(k+'_data');
      if(d){try{const p=JSON.parse(d);if(p&&p.pupils&&p.pupils.length>0)out.push(p);}catch(e){}}
    });
  }catch(e){}
  return out.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
}
function savePrefs(){
  try{localStorage.setItem(PREFS_KEY,JSON.stringify({darkMode,fontScale}));}catch(e){}
}
function loadPrefs(){
  try{
    const d=localStorage.getItem(PREFS_KEY);
    if(d){const p=JSON.parse(d);darkMode=!!p.darkMode;fontScale=p.fontScale||1;}
  }catch(e){}
  applyDark();applyFont();
}
function updateSavedLabel(){
  const el=document.getElementById('hdr-saved');
  if(!el||!S.savedAt)return;
  const m=Math.round((Date.now()-S.savedAt)/60000);
  el.textContent=m<1?'✓ Saved just now':`✓ Saved ${m} min${m>1?'s':''} ago`;
}
setInterval(()=>{if(S.savedAt)updateSavedLabel();},60000);
function timeSince(ts){
  if(!ts)return'unknown';
  const m=Math.round((Date.now()-ts)/60000);
  if(m<1)return'just now';
  if(m<60)return`${m}m ago`;
  const h=Math.round(m/60);
  if(h<24)return`${h}h ago`;
  return`${Math.round(h/24)}d ago`;
}

  const b=document.getElementById('dark-btn');
  if(b)b.textContent=darkMode?'☀️':'🌙';
}
function toggleDark(){darkMode=!darkMode;applyDark();savePrefs();}
function applyFont(){
  document.documentElement.style.setProperty('--font-scale',fontScale);
  const b=document.getElementById('font-btn');
  if(b)b.textContent=fontScale===1?'Aᴬ':fontScale===1.15?'A⁺':'A';

function cycleFontSize(){
  fontScale=fontScale===1?1.15:fontScale===1.15?0.9:1;
  applyFont();savePrefs();
}

/* ══════════════════════════════════════════
   PROGRESS BAR (step 2)
══════════════════════════════════════════ */
function updateFillBar(){
  const subjs=SUBJS[GRP[S.cls]];
  const complete=S.pupils.filter(p=>{
    if(!p.name||!p.name.trim())return false;
    return subjs.some(s=>{const sc=p.scores[s];return sc&&(sc.t1!==''||sc.t2!==''||sc.ex!=='');});
  }).length;
  const total=S.pupils.length;
  const pct=total?Math.round((complete/total)*100):0;
  const bar=document.getElementById('fill-bar');
  const lbl=document.getElementById('fill-lbl');
  if(bar)bar.style.width=pct+'%';
  if(lbl)lbl.textContent=`${complete} of ${total} pupils with scores`;
}

/* ══════════════════════════════════════════
   PROGRESS DOTS
══════════════════════════════════════════ */
function prog(n){
  [1,2,3].forEach(i=>{
    const d=document.getElementById('d'+i);
    if(d)d.className='prog-seg'+(i<n?' done':i===n?' active':'');
  });
}

function resumeSaved(cls,sess){
  try{const d=localStorage.getItem(storeKey(cls,sess)+'_data');if(!d)return;S=JSON.parse(d);showStep2();}
  catch(e){alert('Could not load saved data.');}
}
function deleteSaved(cls,sess){
  if(!confirm(`Delete saved progress for ${cls} (${sess})?`))return;
  clearState(cls,sess);showStep1();
}

function doStep1(){
  const cls=document.getElementById('cls-sel').value;
  const n=parseInt(document.getElementById('np').value);
  const sess=(document.getElementById('sess').value||'').trim();
  if(!n||n<1||n>100){alert('Enter a valid number of pupils (1–100).');return;}
  S.cls=cls;S.n=n;S.session=sess||'2025/2026';
  const grp=GRP[cls];const subjs=SUBJS[grp];const old=S.pupils;
  S.pupils=Array.from({length:n},(_,i)=>old[i]||{name:'',inclRelig:true,absent:false,scores:Object.fromEntries(subjs.map(s=>[s,{t1:'',t2:'',ex:''}]))});
  saveState();showStep2();
}

  let html=`

/* ── Paste names modal ── */
function showPasteNames(){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=`<div class="modal-box">
  <h2>📋 Paste Pupil Names</h2>
  <p>Enter one name per line or separate with commas. Names will fill pupils in order.</p>
  <textarea id="paste-ta" placeholder="e.g.&#10;Adewale Fatima&#10;Bello Usman&#10;Chukwu Ngozi" style="margin-bottom:10px"></textarea>
  <button class="btn btn-primary" onclick="applyPastedNames()">Apply Names →</button>
  <button class="btn" style="margin-top:6px" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
</div>`;
  document.body.appendChild(overlay);
  setTimeout(()=>document.getElementById('paste-ta').focus(),100);
}
function applyPastedNames(){
  const ta=document.getElementById('paste-ta');
  if(!ta)return;
  const names=ta.value.split(/[\n,]/).map(n=>n.trim()).filter(Boolean);
  const limit=S.pupils.length;
  names.forEach((name,i)=>{
    if(i<limit){
      S.pupils[i].name=name;
      const inp=document.getElementById('nm'+i);
      if(inp)inp.value=name;
    }
  });
  saveState();updateFillBar();
  document.querySelector('.modal-overlay').remove();
  if(names.length>limit){
    showToast(`${names.length} names found — ${limit} applied, ${names.length-limit} ignored`,'warn');
  } else {
    showToast(`${Math.min(names.length,limit)} name${names.length>1?'s':''} applied`);
  }
}

/* Score validation — inline only, no alert popups */
function validateScore(el,max){
  const v=parseFloat(el.value);
  if(el.value!==''&&(isNaN(v)||v<0||v>max)){
    el.style.borderColor='var(--danger-text)';
    el.style.boxShadow='0 0 0 2px var(--danger-bg)';
  } else {
    el.style.borderColor='';
    el.style.boxShadow='';
  }
}

function tabIdx(pi,si,col,total){return pi*total*3+si*3+col+1;}

/* Debounce — prevents saving on every single keystroke */
function debounce(fn,ms){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms);};}
const debouncedSave=debounce(saveState,800);

function liveUpdate(pi,si,field,val){
  const subjs=SUBJS[GRP[S.cls]];const s=subjs[si];
  S.pupils[pi].scores[s][field]=val===''?'':parseFloat(val)||0;
  const sc=S.pupils[pi].scores[s];const tot=calcTot(sc);
  const over=sc.t1>20||sc.t2>20||sc.ex>60||(tot!==null&&tot>100);
  const cell=document.getElementById('tot'+pi+'_'+si);
  if(cell){cell.textContent=tot===null?'—':tot;cell.className='tot-cell'+(tot===null?'':over?' tot-err':' tot-ok');}
  refreshSummary(pi);debouncedSave();
}

function refreshSummary(pi){
  const grp=GRP[S.cls];const subjs=SUBJS[grp];const rel=RELIG[grp]||null;
  const sm=calcPupilSummary(S.pupils[pi],subjs,rel);
  const sn=document.getElementById('sn'+pi),sg=document.getElementById('sg'+pi),sa=document.getElementById('sa'+pi);
  if(sn)sn.textContent=sm.count;if(sg)sg.textContent=sm.grand;if(sa)sa.textContent=sm.avg;
}

function toggleRel(pi,checked){
  S.pupils[pi].inclRelig=checked;
  const grp=GRP[S.cls];const rel=RELIG[grp];const subjs=SUBJS[grp];
  const relSi=subjs.indexOf(rel);
  if(relSi>=0){const row=document.getElementById('row'+pi+'_'+relSi);if(row)row.style.display=checked?'':'none';}
  refreshSummary(pi);saveState();
}

function toggleAbsent(pi,checked){
  S.pupils[pi].absent=checked;
  const scores=document.getElementById('scores'+pi);
  const numEl=document.getElementById('pnum'+pi);
  if(scores)scores.style=checked?'opacity:.4;pointer-events:none':'';
  if(numEl)numEl.className='pupil-num'+(checked?' absent-num':'');
  // Show/hide absent banner
  let banner=document.getElementById('absbanner'+pi);
  if(checked&&!banner){
    banner=document.createElement('div');banner.id='absbanner'+pi;
    banner.className='absent-banner';banner.textContent='Absent — scores excluded from class results';
    scores.insertAdjacentElement('beforebegin',banner);
  } else if(!checked&&banner){banner.remove();}
  saveState();
}

function calcTot(sc){
  if(sc.t1===''&&sc.t2===''&&sc.ex==='')return null;
  return(parseFloat(sc.t1)||0)+(parseFloat(sc.t2)||0)+(parseFloat(sc.ex)||0);
}
function calcPupilSummary(p,subjs,rel){
  const active=subjs.filter(s=>!(rel&&s===rel&&!p.inclRelig));
  const tots=active.map(s=>{const sc=p.scores[s]||{};return calcTot(sc)||0;});
  const grand=tots.reduce((a,b)=>a+b,0);
  const avg=tots.length?Math.round((grand/tots.length)*10)/10:0;
  return{count:active.length,grand,avg};
}

/* ══════════════════════════════════════════
   STEP 3 — Results
══════════════════════════════════════════ */
function doCalc(){
  S.pupils.forEach((_,i)=>{const el=document.getElementById('nm'+i);if(el)S.pupils[i].name=el.value;});
  const grp=GRP[S.cls];const subjs=SUBJS[grp];const rel=RELIG[grp]||null;
  S.results=S.pupils.map(p=>{
    const absent=p.absent||false;
    const active=subjs.filter(s=>!(rel&&s===rel&&!p.inclRelig));
    const tots=active.map(s=>{const sc=p.scores[s]||{};return(parseFloat(sc.t1)||0)+(parseFloat(sc.t2)||0)+(parseFloat(sc.ex)||0);});
    const grand=tots.reduce((a,b)=>a+b,0);
    const avg=active.length?Math.round((grand/active.length)*10)/10:0;
    return{name:p.name||'(no name)',active,tots,grand,avg,absent};
  });
  // Assign ranks (excluding absent)
  const present=S.results.filter(r=>!r.absent).map((r,i)=>({...r,_origIdx:S.results.indexOf(r)}));
  present.sort((a,b)=>b.avg-a.avg);
  let rank=1;
  present.forEach((r,i)=>{
    if(i>0&&r.grand<present[i-1].grand)rank=i+1;
    S.results[r._origIdx].rank=rank;
    S.results[r._origIdx].rankTotal=present.length;
  });
  saveState();showStep3();
}

function showStep3(){
  S.step=3;prog(3);
  const hasErr=S.results.some(r=>!r.absent&&r.tots.some(t=>t>100));
  const present=S.results.filter(r=>!r.absent);
  const absentCount=S.results.filter(r=>r.absent).length;

  // Class summary stats
  const avgs=present.map(r=>r.avg);
  const clsAvg=avgs.length?Math.round((avgs.reduce((a,b)=>a+b,0)/avgs.length)*10)/10:0;
  const highest=present.length?present.reduce((a,b)=>b.avg>a.avg?b:a,present[0]):null;
  const lowest=present.length?present.reduce((a,b)=>b.avg<a.avg?b:a,present[0]):null;
  const clsGrade=getGrade(clsAvg);

  let html=`<p class="pg-title">${S.cls} — Results</p>
<p class="pg-sub">Session: ${S.session}</p>
${hasErr?'<div class="alert alert-danger">⚠️ Some totals exceed 100. Go back and check.</div>':present.length?'<div class="alert alert-success">✓ All totals are within range.</div>':''}
${absentCount?`<div class="alert alert-warn">ℹ️ ${absentCount} pupil${absentCount>1?'s':''} marked absent — excluded from class summary.</div>`:''}`;

  // Class summary
  if(present.length){
    html+=`<div class="cls-summary">
  <div class="cls-sum-box"><span class="csl">Pupils</span><span class="csv">${present.length}</span></div>
  <div class="cls-sum-box"><span class="csl">Class Avg</span><span class="csv" style="color:var(--info-text)">${clsAvg}</span></div>
  <div class="cls-sum-box"><span class="csl">Highest Avg</span><span class="csv" style="color:var(--teal)">${highest?highest.avg:'—'}</span></div>
  <div class="cls-sum-box"><span class="csl">Lowest Avg</span><span class="csv" style="color:var(--warn-text)">${lowest?lowest.avg:'—'}</span></div>
</div>`;
  }

  // Individual results
  S.results.forEach((r,i)=>{
    const grade=getGrade(r.avg);
    const rankStr=r.absent?'Absent':(r.rank?ordinal(r.rank)+' of '+r.rankTotal:'—');
    html+=`<div class="card" ${r.absent?'style="opacity:.6"':''}>
<div class="res-name">
  <span>${i+1}. ${esc(r.name)}</span>
  ${r.absent?'<span class="badge" style="background:var(--danger-bg);color:var(--danger-text)">Absent</span>':''}
  ${!r.absent?`<span class="rank-badge">${rankStr}</span>`:''}
  <span class="badge">${r.active.length} subjects</span>
</div>
<table class="rt"><thead><tr><th>Subject</th><th>Total /100</th><th>Grade</th><th>Remark</th></tr></thead><tbody>`;
    r.active.forEach((s,si)=>{
      const t=r.tots[si];const over=t>100;const sg=getGrade(t);
      html+=`<tr><td>${s}</td><td ${over?'style="color:var(--danger-text);font-weight:600"':''}>${t}</td><td class="grade-${sg.g}">${sg.g}</td><td>${sg.r}</td></tr>`;
    });
    html+=`</tbody><tfoot>
<tr class="sum-row grand"><td>Grand Total</td><td colspan="3">${r.grand}</td></tr>
<tr class="sum-row avg"><td>Average ÷ ${r.active.length}</td><td>${r.avg}</td><td class="grade-${grade.g}">${grade.g}</td><td>${grade.r}</td></tr>
</tfoot></table></div>`;
  });

  // Subject averages card
  if(present.length){
    const subjs=SUBJS[GRP[S.cls]];
    html+=`<div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:10px;color:var(--text2)">📊 Subject Class Averages</div>
<table class="rt"><thead><tr><th>Subject</th><th>Class Avg /100</th><th>Grade</th></tr></thead><tbody>`;
    subjs.forEach(s=>{
      const scores=present.map(r=>{const si=r.active.indexOf(s);return si>=0?r.tots[si]:null;}).filter(v=>v!==null);
      if(scores.length){
        const avg=Math.round((scores.reduce((a,b)=>a+b,0)/scores.length)*10)/10;
        const sg=getGrade(avg);
        html+=`<tr><td>${s}</td><td>${avg}</td><td class="grade-${sg.g}">${sg.g}</td></tr>`;
      }
    });
    html+=`</tbody></table></div>`;
  }

  html+=`<button class="btn btn-success" onclick="doDownload()">⬇ Download Results as CSV</button>
<p style="font-size:11px;color:var(--text3);text-align:center;margin-top:6px">💡 Always download CSV as a permanent backup — browser data can be cleared</p>
<div class="spacer"></div>
<button class="btn btn-print" onclick="doPrint()">🖨 Print — 1 page per pupil</button>
<div class="spacer"></div>
<button class="btn btn-warn" onclick="doPrintClassSheet()">🗒 Print Class Summary Sheet</button>
<div class="spacer"></div>
<button class="btn btn-teal" onclick="showStep2()">← Back to scores</button>
<div class="spacer"></div>
<button class="btn" onclick="reset()">Start new class</button>`;

/* ══════════════════════════════════════════
   CSV DOWNLOAD
══════════════════════════════════════════ */
function doDownload(){
  const grp=GRP[S.cls];const allSubjs=SUBJS[grp];const rel=RELIG[grp]||null;
  const date=new Date().toLocaleDateString('en-NG',{day:'2-digit',month:'short',year:'numeric'});
  const hdr=['S/N','Pupil Name','Rank','Average','Grade','Remark'];
  allSubjs.forEach(s=>hdr.push(s+'_T1',s+'_T2',s+'_Ex',s+'_Total'));
  hdr.push('Grand Total','Subjects','Absent');
  if(rel)hdr.push('Includes_'+rel.replace(/\s/g,'_'));
  const rows=[hdr.join(',')];
  S.results.forEach((r,i)=>{
    const p=S.pupils[i];const grade=getGrade(r.avg);
    const row=[i+1,`"${r.name}"`,r.absent?'Absent':(r.rank?ordinal(r.rank):'—'),r.avg,grade.g,grade.r];
    allSubjs.forEach(s=>{
      const isActive=r.active.includes(s);
      if(isActive&&!r.absent){const sc=p.scores[s]||{};const tot=r.tots[r.active.indexOf(s)];row.push(sc.t1===''?0:sc.t1,sc.t2===''?0:sc.t2,sc.ex===''?0:sc.ex,tot);}
      else row.push('','','','');
    });
    row.push(r.grand,r.active.length,r.absent?'Yes':'No');
    if(rel)row.push(p.inclRelig?'Yes':'No');
    rows.push(row.join(','));
  });
  rows.push('',`"Class: ${S.cls}"`,`"Session: ${S.session}"`,`"Date: ${date}"`,`"E-Champions Result Manager v9.3"`);
  const blob=new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`${S.cls.replace(/\s/g,'_')}_${S.session.replace(/\//g,'-')}_${date.replace(/\s/g,'_')}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function reset(){clearState(S.cls,S.session);S={step:1,cls:'Basic 5',n:0,session:'2025/2026',pupils:[],results:[]};showStep1();}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg,type='info'){
  const t=document.createElement('div');
  const bg=type==='warn'?'var(--warn-bg)':'var(--success-bg)';
  const col=type==='warn'?'var(--warn-text)':'var(--success-text)';
  t.style.cssText=`position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:${bg};color:${col};padding:8px 18px;border-radius:20px;font-size:12px;font-weight:600;z-index:999;white-space:nowrap;box-shadow:0 2px 12px rgba(0,0,0,.15);transition:opacity .3s`;

}

/* ══════════════════════════════════════════
   CSV UPLOAD & PARSE
══════════════════════════════════════════ */
function handleUpload(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{try{loadFromCSV(e.target.result);}catch(err){alert('Could not read this file.\n\n'+err.message+'\n\nMake sure it was downloaded from this app.');input.value='';}};
  reader.readAsText(file);
}
function parseRow(line){
  const res=[];let cur='';let inQ=false;
  for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){res.push(cur.trim());cur='';}else{cur+=c;}}
  res.push(cur.trim());return res;
}
function loadFromCSV(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim());
  let cls=null,sess=null;
  for(const line of lines){
    const cm=line.replace(/^"|"$/g,'').match(/^Class:\s*(.+)$/);if(cm&&!cls){cls=cm[1].trim();}
    const sm=line.replace(/^"|"$/g,'').match(/^Session:\s*(.+)$/);if(sm&&!sess){sess=sm[1].trim();}
  }
  if(!cls)throw new Error('Class name not found.');
  if(!GRP[cls])throw new Error(`"${cls}" is not a recognised class.`);
  const headerLine=lines.find(l=>l.startsWith('S/N')||l.startsWith('"S/N'));
  if(!headerLine)throw new Error('Header row not found.');
  const headers=parseRow(headerLine);
  const nameCol=headers.findIndex(h=>h==='Pupil Name');
  if(nameCol<0)throw new Error('Pupil Name column not found.');
  const grp=GRP[cls];const subjs=SUBJS[grp];const rel=RELIG[grp]||null;
  const colMap={};
  subjs.forEach(s=>{['T1','T2','Ex'].forEach(f=>{const idx=headers.findIndex(h=>h===s+'_'+f);if(idx>=0)colMap[s+'|'+f.toLowerCase()]=idx;});});
  let relCol=-1;if(rel)relCol=headers.findIndex(h=>h==='Includes_'+rel.replace(/\s/g,'_'));
  const absentCol=headers.findIndex(h=>h==='Absent');
  const pupils=[];
  for(const line of lines){
    if(!line||line.startsWith('S/N')||line.startsWith('"S/N'))continue;
    const cols=parseRow(line);
    if(!cols[0]||isNaN(parseInt(cols[0])))continue;
    const name=cols[nameCol]||'';
    const scores=Object.fromEntries(subjs.map(s=>[s,{t1:'',t2:'',ex:''}]));
    subjs.forEach(s=>{['t1','t2','ex'].forEach(f=>{const idx=colMap[s+'|'+f];if(idx!==undefined&&cols[idx]!==undefined&&cols[idx]!==''){const v=parseFloat(cols[idx]);scores[s][f]=isNaN(v)?'':v;}});});
    let inclRelig=true;if(rel&&relCol>=0)inclRelig=cols[relCol]!=='No';
    let absent=false;if(absentCol>=0)absent=cols[absentCol]==='Yes';
    pupils.push({name,inclRelig,absent,scores});
  }
  if(pupils.length===0)throw new Error('No pupil records found.');
  S.cls=cls;S.n=pupils.length;S.pupils=pupils;S.results=[];
  if(sess)S.session=sess;
  showStep2();
}
